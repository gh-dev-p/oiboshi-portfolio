name: oiboshi
description: "推しの発信者の更新（配信・投稿・予定）を1つのアプリで追う。"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2
  video_player: ^2.11.1
  url_launcher: ^6.3.2
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.7
  purchases_flutter: 10.16.0
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  unorm_dart: ^0.3.3
  app_links: ^7.2.2
  share_plus: ^13.3.1
  qr: ^4.0.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.15.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # 表示文言の多言語化（日本語・英語。l10n.yaml、i18n設計書）。
  generate: true
  # 他社のサービスの公式のロゴ（各社のブランドの素材。tech-risks.md 2.21）。
  assets:
    - assets/brands/
    - assets/logo/
    # 追星の星のキャラクター（黄・青・緑・赤）。背景を透明にした PNG。元の絵は assets/characters/original/*.webp
    # （手を加えない。下のフォルダなので、アプリには入らない）。作り直すときは、app/ で
    # `python3 tool/character_cutout.py assets/characters/original/{色}.webp assets/characters/{色}.png`（Pillow が要る）。
    - assets/characters/

# アプリのアイコン。元の絵は assets/icon/app_icon_original.png（1254×1254）。1024×1024 に縮めたものを app_icon.png に置き、`dart run flutter_launcher_icons -f pubspec.yaml` で作り直す（`-f` を付けないと、dev の `flutter_launcher_icons-dev.yaml` だけを作る）（ios/Runner.xcodeproj/project.pbxproj を書き換えるので、その変更は戻す）。
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  remove_alpha_ios: true
  android: true
  # Android のアダプティブアイコン：絵の背景（生成り）と同じ色の上に、絵を内側に寄せて置く（端は丸く切られるため）。
  adaptive_icon_background: "#FDF9F3"
  adaptive_icon_foreground: assets/icon/app_icon.png
  adaptive_icon_foreground_inset: 16
